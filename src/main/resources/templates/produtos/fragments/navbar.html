<nav th:fragment="navbar"
     xmlns:th="http://www.thymeleaf.org"
     class="navbar navbar-expand-lg custom-navbar">

    <div class="container">

        <!-- Logo / Marca -->
        <a class="navbar-brand brand-logo" th:href="@{/usuario/home}">
            <div class="brand-icon">PS</div>
            <span>Portal Saneamento Santos</span>
        </a>

        <!-- Botão Mobile -->
        <button class="navbar-toggler custom-toggler"
                type="button"
                id="botaoMenuMobile"
                aria-controls="menuNavbar"
                aria-expanded="false"
                aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links e Menu -->
        <div class="collapse navbar-collapse" id="menuNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2">

                <!-- Botão de Sair -->
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn-logout">
                            Sair
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>

    <!-- Estilos da Navbar e Menu Mobile Estilizado -->
    <style>
        .custom-navbar {
            background-color: var(--branco, #FFFFFF);
            border-bottom: 1px solid var(--borda, #DCE7DF);
            box-shadow: 0 4px 20px rgba(20, 83, 45, 0.04);
            padding: 12px 0;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--verde-escuro, #14532D) !important;
            font-weight: 750;
            font-size: 18px;
            text-decoration: none;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--verde-claro, #E8F5EC);
            color: var(--verde-escuro, #14532D);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
        }

        .custom-nav-link {
            color: var(--texto, #26352C) !important;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
            padding: 8px 12px !important;
            border-radius: 6px;
        }

        .custom-nav-link:hover {
            color: var(--verde-principal, #198754) !important;
            background-color: var(--verde-claro, #E8F5EC);
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 16px;
            border: 1px solid #FCA5A5;
            border-radius: 8px;
            background: #FEF2F2;
            color: #DC2626;
            font-family: inherit;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-logout:hover {
            background: #FEE2E2;
            border-color: #F87171;
            color: #991B1B;
            transform: translateY(-1px);
        }

        .custom-toggler {
            border-color: var(--borda, #DCE7DF);
            padding: 6px 10px;
            border-radius: 8px;
            background: #FAFAFA;
        }

        .custom-toggler:focus {
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
        }

        /* Ajustes específicos para o menu expandido no Celular / Mobile */
        @media (max-width: 991px) {
            .navbar-collapse {
                padding: 16px;
                border-top: 1px solid var(--borda, #DCE7DF);
                margin-top: 12px;
                background-color: #FAFCFA;
                border-radius: 12px;
                box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
                display: none; /* Oculto por padrão */
            }
            .navbar-collapse.show {
                display: block; /* Mostra ao abrir */
            }
            .navbar-nav {
                gap: 10px !important;
            }
            .btn-logout {
                width: 100%;
                margin-top: 4px;
            }
        }
    </style>

    <!-- Script puro para abrir/fechar o menu mobile com suavidade -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const botao = document.getElementById("botaoMenuMobile");
            const menu = document.getElementById("menuNavbar");

            if (botao && menu) {
                botao.addEventListener("click", function () {
                    menu.classList.toggle("show");
                });
            }
        });
    </script>
</nav>
