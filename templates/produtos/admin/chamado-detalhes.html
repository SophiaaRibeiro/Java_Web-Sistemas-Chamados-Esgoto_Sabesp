
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Chamado | Gestão de Chamados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{produtos/fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Detalhes do Chamado</h2>
            <p class="text-muted">
                Consulte as informações da ocorrência registrada.
            </p>
        </div>

        <a th:href="@{/admin/chamados}"
           class="btn btn-outline-secondary">
            Voltar
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h5 class="mb-4">
                Chamado #<span th:text="${chamado.id}"></span>
            </h5>

            <div class="mb-3">
                <strong>Endereço:</strong>
                <p th:text="${chamado.endereco}"></p>
            </div>

            <div class="mb-3">
                <strong>Tipo de problema:</strong>
                <p th:text="${chamado.tipoProblema}"></p>
            </div>

            <div class="mb-3">
                <strong>Descrição:</strong>
                <p th:text="${chamado.descricao}"></p>
            </div>

            <div class="mb-3">
                <strong>Data de abertura:</strong>
                <p th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}"></p>
            </div>

            <div class="mb-3">
                <strong>Status:</strong>
                <span class="badge bg-primary"
                      th:text="${chamado.status}">
                </span>
            </div>

            <hr>

            <h5 class="mb-3">Imagens anexadas</h5>

            <div class="row g-3"
                 th:if="${chamado.imagens != null and !chamado.imagens.isEmpty()}">

                <div class="col-md-4"
                     th:each="imagem : ${chamado.imagens}">

                    <img th:src="@{'/' + ${imagem.caminhoImagem}}"
                         class="img-fluid rounded border"
                         alt="Imagem do chamado">

                </div>
            </div>

            <p class="text-muted"
               th:if="${chamado.imagens == null or chamado.imagens.isEmpty()}">
                Nenhuma imagem anexada.
            </p>

            <hr>

            <form th:action="@{/admin/chamados/atualizar-status/{id}(id=${chamado.id})}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">
                        Atualizar status
                    </label>

                    <select name="status" class="form-select" required>
                        <option value="ABERTO"
                                th:selected="${chamado.status == 'ABERTO'}">
                            Aberto
                        </option>

                        <option value="EM_ANALISE"
                                th:selected="${chamado.status == 'EM_ANALISE'}">
                            Em análise
                        </option>

                        <option value="EM_ANDAMENTO"
                                th:selected="${chamado.status == 'EM_ANDAMENTO'}">
                            Em andamento
                        </option>

                        <option value="RESOLVIDO"
                                th:selected="${chamado.status == 'RESOLVIDO'}">
                            Resolvido
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Salvar alteração
                </button>

            </form>

        </div>
    </div>

</main>

</body>
</html>
